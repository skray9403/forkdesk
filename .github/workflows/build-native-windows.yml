name: Build Native Windows

on:
  push:
    branches: [native-windows-foundation]
    paths:
      - 'windows-native/**'
      - '.github/workflows/build-native-windows.yml'
  pull_request:
    paths:
      - 'windows-native/**'
      - '.github/workflows/build-native-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows-native
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore x64
        run: dotnet restore TwinDesk.Native.csproj -r win-x64

      - name: Test native core
        run: dotnet test Tests/TwinDesk.Native.Tests.csproj --configuration Release

      - name: Build x64
        run: dotnet build TwinDesk.Native.csproj --configuration Release --no-restore -r win-x64 -p:Platform=x64 --self-contained false

      - name: Restore ARM64
        run: dotnet restore TwinDesk.Native.csproj -r win-arm64

      - name: Build ARM64
        run: dotnet build TwinDesk.Native.csproj --configuration Release --no-restore -r win-arm64 -p:Platform=ARM64 --self-contained false
