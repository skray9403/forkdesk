name: Build Native Windows

on:
  push:
    branches: [native-windows-foundation]
    paths:
      - 'windows-native/**'
      - '.github/workflows/build-native-windows.yml'
  pull_request:
    paths:
      - 'windows-native/**'
      - '.github/workflows/build-native-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows-native/TwinDesk.Native.csproj

      - name: Build x64
        run: dotnet build windows-native/TwinDesk.Native.csproj --configuration Release --no-restore -p:Platform=x64

      - name: Build ARM64
        run: dotnet build windows-native/TwinDesk.Native.csproj --configuration Release --no-restore -p:Platform=ARM64
